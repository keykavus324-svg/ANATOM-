<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">İki devreyi birleştiren dört odacık</title><desc id="description">Oklar akış yönünü gösterir. Renkler göreli oksijenlenmeyi ayırır; venöz kan mavi değildir. Şekil kalbin gerçek yüzey görünümü değildir. 1. Sağ atrium → sağ ventrikül: Sistemik dönüş triküspit kapaktan sağ ventriküle geçer. 2. Akciğer devresi: Pulmoner kapak ve arterler kanı akciğere taşır; pulmoner venler sol atriuma getirir. 3. Sol atrium → sol ventrikül: Mitral geçişten sonra aort kapağı sistemik çıkışa açılır. 4. Sistemik devre: Aorta–doku kapillerleri–ana venler yolu sağ atriuma geri döner.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><rect x="272" y="141" width="90" height="62" rx="12" fill="#dce5df" stroke="#666b55" stroke-width="1.7"/><rect x="272" y="237" width="90" height="67" rx="12" fill="#cad9d6" stroke=