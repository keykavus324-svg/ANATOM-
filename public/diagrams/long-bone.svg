<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Uzun kemiğin iç düzeni</title><desc id="description">İçi açılmış uzun kemik şeması. Kortikal tabaka gövdede daha kalın, uçlarda süngerimsi ağ daha belirgindir. 1. Epifiz: Uzun kemiğin genişlemiş uç bölgesi. 2. Eklem kıkırdağı: Eklemleşen yüzü örter; periostun devamı değildir. 3. Kompakt kemik: Dayanıklı dış kabuğu oluşturur. 4. Medüller boşluk: Diafiz içindeki ilik alanı. 5. Süngerimsi kemik: Trabeküller yüklenme doğrultularıyla ilişkili iç ağ oluşturur. 6. Periost: Eklem yüzü dışındaki kemik yüzeyini saran örtü.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M324 52C286 53 278 93 300 124C317 146 316 170 316 209L316 268C316 301 304 321 294 341C277 375 304 410 333 404C354 400 363 399 388 404C420 411 443 380 427 350C409 319 405 299 405 267L405 204C405 166 407 144 422 121C443 