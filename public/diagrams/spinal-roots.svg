<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Ön–arka kök ile ön–arka dal</title><desc id="description">Kesitin üstü posterior, altı anteriordur. Sağ taraftaki bağlantılar büyütülerek gösterilir; iki tarafta da benzer kök düzeni bulunur. 1. Arka kök ve ganglion: Duyusal lifler girer; duyu nöronlarının gövdeleri gangliondadır. 2. Ön kök: Motor lifler omurilikten çıkar. 3. Karma spinal sinir: Köklerin birleşmesinden sonraki kısa ortak bölüm. 4. Ön ve arka dallar: Her ikisi de karma lifler içerir. 5. Gri cevher: Boynuzlar ve merkezi bağlantı bölgesi.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><ellipse cx="267" cy="226" rx="108" ry="127" fill="url(#bone)" stroke="#666b55" stroke-width="2"/><path d="M261 208C228 182 234 129 213 143C187 167 216 210 243 224C212 235 185 287 210 302C237 315 244 263 264 241L278 241C298 270 306 318 33