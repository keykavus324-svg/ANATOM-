<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Dirsekte karşıt kasların çalışması</title><desc id="description">Dirsek bükülürken fleksörlerin kuvvet yönü ve arkadaki ekstansör grup gösterilir. Tendon tutunmaları ayrıntılı cerrahi harita değil, mekanik ilişki şemasıdır. 1. Fleksör grup: Brachialis ve biceps brachii gibi kaslar fleksiyona katkı verir. 2. Ekstansör grup: Triceps brachii dirsekte ekstansiyon oluşturur. 3. Dirsek ekseni: Kemiklerin etrafında açısal hareket yaptığı bölge. 4. Direnç: Elde tutulan yük veya önkolun ağırlığı hareketi etkiler.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M266 87Q245 81 242 102L247 279Q241 302 264 306L285 299L276 111Q284 91 266 87Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M268 297Q291 289 309 305L535 260Q555 270 540 285L306 334Q278 342 261 319Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M278 129Q341 190 284 263L279 310L267 312L266 263Q288 195 265 133Z" fill="url(#muscle)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M242 135Q196 199 241 271L250 304L259 302L249 271Q229 202 251 139Z" fill="#a8b69a" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="268" cy="306" rx="12" ry="12" fill="#e8dcc2" stroke="#666b55" stroke-width="2"/><rect x="534" y="230" width="47" height="67" rx="5" fill="#d5c6a8" stroke="#666b55" stroke-width="1.7"/><path d="M365 285Q393 249 384 218" fill="none" stroke="#cb9b91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M556 303L556 369" fill="none" stroke="#666b55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M382 132L300 194" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="300" cy="194" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="382" cy="132" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="382" y="137" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">1</text><path d="M138 197L229 206" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="229" cy="206" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="138" cy="197" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="138" y="202" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">2</text><path d="M160 366L268 307" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/>