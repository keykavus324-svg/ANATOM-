<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Alveol ile kapiller arasında</title><desc id="description">Alveol duvarı ve komşu kapiller büyütülmüştür. Oklar gazların net difüzyon yönünü gösterir; zar kalınlıkları ölçekli değildir. 1. Alveol havası: Ventilasyonla yenilenen gaz karışımı. 2. İnce difüzyon bariyeri: Alveol epiteli ve kapiller endotel gazların geçiş mesafesini azaltır. 3. Oksijen: Alveolden kana doğru geçer. 4. Karbondioksit: Kandan alveole doğru geçer. 5. Pulmoner kapiller: Kan akımı gazların taşınmasını sürdürür.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M274 57L274 132C212 156 206 275 265 309Q337 354 410 307C469 262 459 168 398 132L398 57" fill="url(#bone)" stroke="#666b55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M294 57L294 142C242 170 231 254 277 290Q337 326 398