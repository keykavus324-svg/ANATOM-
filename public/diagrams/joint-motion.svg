<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Biçim hareketi sınırlar</title><desc id="description">Solda menteşe, sağda eksen çevresinde dönüş modeli. Bunlar gerçek eklemlerin mekanik özelliklerini sadeleştiren geometrik benzetmelerdir. 1. Menteşe: Temel hareket bir eksen çevresinde fleksiyon–ekstansiyondur. 2. Pivot: Bir kemik, halka benzeri düzen içinde uzunlamasına eksen çevresinde döner. 3. Dönme ekseni: Menteşede enine; pivotta uzunlamasına gösterilmiştir.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><rect x="157" y="126" width="125" height="32" rx="12" fill="url(#bone)" stroke="#666b55" stroke-width="1.7"/><rect x="163" y="239" width="37" height="141" rx="12" fill="url(#bone)" stroke="#666b55" stroke-width="1.7"/><ellipse cx="224" cy="219" rx="61" ry="61" fill="url(#bone)" stroke="#666b55" stroke-width="2"/><ellipse cx="224" cy="219" rx="22" ry="22" fill="#f9f5e9" stroke="#666b55" stroke-width="2"/><path d="M232 108C319 127 343 209 299 285" fill="none" stroke="#cb9b91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M106 219L337 219" fill="none" stroke="#666b55" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><rect x="492" y="88" width="48" height="296" rx="12" fill="url(#bone)" stroke="#666b55" stroke-width="1.7"/><ellipse cx="516" cy="239" rx="74" ry="39" fill="none" stroke="#666b55" stroke-width="2"/><path d="M444 245Q445 288 516 292Q582 290 589 245" fill="none" stroke="#a8b69a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" /><path d="M471 135C521 98 575 147 570 191" fill="none" stroke="#cb9b91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M516 58L516 408" fill="none" stroke="#666b55" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 5"/><path d="M116 351L176 307" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="176" cy="307" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="116" cy="351" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="116" y="356" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">1</text><path d="M651 277L581 262" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="581" cy="262" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="651" cy="277" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="651" y="282" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">2</text><path d="M369 74L516 75" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="516" cy="75" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="369" cy="74" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="369" y="79" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">3</text><text x="221" y="421" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">GINGLYMUS</text><text x="515" y="421" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">TROCHOIDEA</text></g></svg>
