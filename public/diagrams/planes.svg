<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Üç düzlem, üç bakış</title><desc id="description">Şeffaf yüzeyler vücudu bölen temel düzlemleri gösterir. Düzlemler hacim içinde düşünülmelidir; bir organın sınırı değildir. 1. Sagittal düzlem: Sağ ve sol bölümleri ayırır. Tam orta hattan geçerse median düzlemdir. 2. Frontal düzlem: Ön ve arka bölümleri ayırır; koronal adı da kullanılır. 3. Transvers düzlem: Üst ve alt bölümleri ayırır; yatay kesitlerin temelidir.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M354 84C340 65 347 40 367 40C389 40 396 66 380 84L382 102C405 108 420 116 427 143L454 215L441 222L407 163L408 246L419 371L400 373L374 274L366 274L344 373L325 371L335 246L337 163L303 222L290 215L316 143C323 118 341 107 354 102Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M269 104L438 89L441 328L270 344Z" fill="#a8b69a" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".35"/><path d="M368 91L428 121L428 360L368 332Z" fill="#cb9b91" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".38"/><path d="M266 237L379 200L478 237L369 276Z" fill="#99adb2" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity=".53"/><path d="M538 122L405 153" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="405" cy="153" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="538" cy="122" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="538" y="127" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">1</text><path d="M207 132L299 149" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="299" cy="149" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="207" cy="132" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="207" y="137" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">2</text><path d="M552 280L443 245" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="443" cy="245" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="552" cy="280" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="552" y="285" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">3</text><text x="377" y="406" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">ANTERIOR / ÖN</text></g></svg>
