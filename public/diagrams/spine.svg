<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Omurganın bölgeleri ve eğrilikleri</title><desc id="description">Bölgesel eğrilikler ve omur grupları gösterilmiştir. İnce çizgiler omurları ayırır; sinir ve bağ ayrıntıları çizilmemiştir. 1. Servikal • 7: Boyun bölgesi; öne konveks eğrilik. 2. Torakal • 12: Kaburgalarla eklemleşen bölge; arkaya konveks eğrilik. 3. Lumbal • 5: Bel bölgesi; öne konveks eğrilik. 4. Sacrum: Genellikle beş kaynaşmış sakral omur. 5. Coccyx: Genellikle dört, sayısı değişebilen kaynaşmış omur.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><rect x="354" y="54" width="27" height="10" rx="3" fill="#a8b69a" stroke="#666b55" stroke-width="1.7"/><path d="M386 56l31 9l-31 -2" fill="#e8dcc2" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><rect x="347.19204606132666" y="66" widt