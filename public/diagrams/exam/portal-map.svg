<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title description"><title id="title">Karaciğerde iki kan girişi, bir venöz çıkış</title><desc id="description">Organ konumlarını değil bağlantı yönünü gösteren akış şemasıdır. Portal ven ve hepatik arterin sinüzoidlerde birleşen kan akışını izle. Safra yolu bu kan akışı şemasına dahil edilmemiştir. Sindirim organlarının kapillerleri: portal dolaşımın ilk kapiller yatağı. V. portae: venöz kanı karaciğere getirir. A. hepatica propria: ayrı arteriyel giriştir. Karaciğer sinüzoidleri: kanın geçtiği ikinci kapiller yatak. Vv. hepaticae: karaciğerden çıkan venöz yol. V. cava inferior: hepatik venlerin ulaştığı sistemik damar.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667a55"/></marker></defs><rect width="760" height="480" fill="#f8f4e9"/><rect x="35" y="70" width="300" height="65" rx="12" fill="#e2e7d8" stroke="#879477" stroke-width="1.5"/><text x="47" y="108.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">1. Organ kapillerleri</text><rect x="50" y="180" width="270" height="60" rx="12" fill="#d9e1e9" stroke="#879477" stroke-width="1.5"/><text x="62" y="216" font-size="16" fill="#44563c" font-family="Arial,sans-serif">2. V. portae</text><rect x="425" y="180" width="300" height="60" rx="12" fill="#e5bfb1" stroke="#879477" stroke-width="1.5"/><text x="437" y="216" font-size="16" fill="#44563c" font-family="Arial,sans-serif">3. A. hepatica propria</text><rect x="210" y="285" width="350" height="65" rx="12" fill="#e5d7ba" stroke="#879477" stroke-width="1.5"/><text x="222" y="323.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">4. Karaciğer sinüzoidleri</text><rect x="40" y="395" width="300" height="55" rx="12" fill="#d9e1e9" stroke="#879477" stroke-width="1.5"/><text x="52" y="428.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">5. Vv. hepaticae</text><rect x="430" y="395" width="300" height="55" rx="12" fill="#d9e1e9" stroke="#879477" stroke-width="1.5"/><text x="442" y="428.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">6. V. cava inferior</text><path d="M185 135L185 175" fill="none" stroke="#667a55" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 240L290 280" fill="none" stroke="#667a55" stroke-width="2" marker-end="url(#arrow)"/><path d="M575 240L480 280" fill="none" stroke="#667a55" stroke-width="2" marker-end="url(#arrow)"/><path d="M310 350L200 390" fill="none" stroke="#667a55" stroke-width="2" marker-end="url(#arrow)"/><path d="M340 422L425 422" fill="none" stroke="#667a55" stroke-width="2" marker-end="url(#arrow)"/><text x="415" y="95" font-size="15" fill="#44563c" font-family="Arial,sans-serif">Aortadan arteriyel kan</text><path d="M570 110L570 175" fill="none" stroke="#b78370" stroke-width="2" marker-end="url(#arrow)"/><text x="35" y="33" font-size="16" fill="#44563c" font-family="Arial,sans-serif">KAN AKIŞ YÖNLERİ • ORGAN KONUMU DEĞİLDİR</text></svg>