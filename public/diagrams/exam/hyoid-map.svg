<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title description"><title id="title">Hyoid çevresindeki iki kas grubu</title><desc id="description">Bu bir grup sınıflama şemasıdır; kasların gerçek seyri, tutunma çizgisi veya derinliği değildir. Suprahyoid adları üstte, infrahyoid adları altta verilmiştir. Her birinin farklı kemik/kıkırdak tutunmaları için metindeki tabloyu oku. Suprahyoid: mylohyoideus, geniohyoideus, stylohyoideus, digastricus. Hyoid: sınıflamayı adlandıran referans kemik. Infrahyoid: sternohyoideus, omohyoideus, sternothyroideus, thyrohyoideus. Thyrohyoideus: adına rağmen üst grupta değil; thyroid kıkırdak–hyoid arası.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667a55"/></marker></defs><rect width="760" height="480" fill="#f8f4e9"/><text x="50" y="50" font-size="16" fill="#44563c" font-family="Arial,sans-serif">GRUP HARİTASI • TUTUNMA ÇİZGİLERİ DEĞİLDİR</text><rect x="50" y="85" width="310" height="65" rx="12" fill="#e1e7d6" stroke="#879477" stroke-width="1.5"/><text x="62" y="123.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Mylohyoideus</text><rect x="395" y="85" width="310" height="65" rx="12" fill="#e1e7d6" stroke="#879477" stroke-width="1.5"/><text x="407" y="123.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Geniohyoideus</text><rect x="50" y="165" width="310" height="65" rx="12" fill="#e1e7d6" stroke="#879477" stroke-width="1.5"/><text x="62" y="203.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Stylohyoideus</text><rect x="395" y="165" width="310" height="65" rx="12" fill="#e1e7d6" stroke="#879477" stroke-width="1.5"/><text x="407" y="203.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Digastricus</text><circle cx="30" cy="120" r="13" fill="#526d48"/><text x="26" y="125" font-size="14" fill="#fff" font-family="Arial,sans-serif">1</text><rect x="270" y="250" width="220" height="45" rx="12" fill="#e4d3ae" stroke="#879477" stroke-width="1.5"/><text x="282" y="278.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">HYOID KEMİK</text><circle cx="512" cy="274" r="13" fill="#526d48"/><text x="508" y="279" font-size="14" fill="#fff" font-family="Arial,sans-serif">2</text><rect x="50" y="315" width="310" height="55" rx="12" fill="#ead9cd" stroke="#879477" stroke-width="1.5"/><text x="62" y="348.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Sternohyoideus</text><rect x="395" y="315" width="310" height="55" rx="12" fill="#ead9cd" stroke="#879477" stroke-width="1.5"/><text x="407" y="348.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Omohyoideus</text><rect x="50" y="385" width="310" height="55" rx="12" fill="#ead9cd" stroke="#879477" stroke-width="1.5"/><text x="62" y="418.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Sternothyroideus</text><rect x="395" y="385" width="310" height="55" rx="12" fill="#d4b3a0" stroke="#879477" stroke-width="1.5"/><text x="407" y="418.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Thyrohyoideus</text><circle cx="30" cy="343" r="13" fill="#526d48"/><text x="26" y="348" font-size="14" fill="#fff" font-family="Arial,sans-serif">3</text><circle cx="690" cy="412" r="13" fill="#526d48"/><text x="686" y="417" font-size="14" fill="#fff" font-family="Arial,sans-serif">4</text></svg>