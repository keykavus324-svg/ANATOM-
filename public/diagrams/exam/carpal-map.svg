y="168" font-size="14" fill="#fff" font-family="Arial,sans-serif">5</text><circle cx="230" cy="163" r="13" fill="#526d48"/><text x="226" y="168" font-size="14" fill="#fff" font-family="Arial,sans-serif">6</text><circle cx="388" cy="163" r="13" fill="#526d48"/><text x="384" y="168" font-size="14" fill="#fff" font-family="Arial,sans-serif">7</text><circle cx="546" cy="163" r="13" fill="#526d48"/><text x="542" y="168" font-size="14" fill="#fff" font-family="Arial,sans-serif">8</text><text x="270" y="405" font-size="16" fill="#44563c" font-family="Arial,sans-serif">PROKSİMAL • ÖNKOLA</text><text x="45" y="448" font-size="13" fill="#44563c" font-family="Arial,sans-serif">Bloklar gerçek kemik biçimini göstermez. Palmar yerleşim haritası.</text></svg>