<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title description"><title id="title">Karpal kemiklerin yön haritası</title><desc id="description">Sağ elin palmar görünümüne göre kavramsal yerleşim: distal üstte, radius / başparmak tarafı solda. Kemikler bloklarla gösterilir; gerçek konturları ve boyutları değildir. Pisiforme, triquetrumun palmarına binen küçük daireyle gösterilir. Scaphoideum: proksimal sıranın radial ucu. Lunatum: scaphoideumun medial komşusu. Triquetrum: proksimal sırada ulnar tarafta. Pisiforme: triquetrumun palmarında; aynı düz çizgi üzerinde dördüncü blok değildir. Trapezium: distal sırada başparmak metakarpıyla eklemleşir. Trapezoideum: trapeziumun medialinde. Capitatum: distal sıranın orta bölümünde. Hamatum: distal sıranın ulnar tarafında.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667a55"/></marker></defs><rect width="760" height="480" fill="#f8f4e9"/><text x="35" y="78" font-size="13" fill="#44563c" font-family="Arial,sans-serif">RADIUS / BAŞPARMAK TARAFI</text><text x="520" y="78" font-size="13" fill="#44563c" font-family="Arial,sans-serif">ULNA TARAFI</text><text x="290" y="40" font-size="16" fill="#44563c" font-family="Arial,sans-serif">DİSTAL • PARMAKLARA</text><rect x="55" y="145" width="142" height="85" rx="12" fill="#e6dcc1" stroke="#879477" stroke-width="1.5"/><text x="67" y="193.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Trapezium</text><rect x="210" y="145" width="145" height="85" rx="12" fill="#e6dcc1" stroke="#879477" stroke-width="1.5"/><text x="222" y="193.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Trapezoideum</text><rect x="368" y="145" width="145" height="85" rx="12" fill="#e6dcc1" stroke="#879477" stroke-width="1.5"/><text x="380" y="193.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">Capitatum</text><rect x="526" y=