<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title description"><title id="title">Central oluğun iki yanı</title><desc id="description">Sol hemisferin lateral yüzünün basitleştirilmiş yön haritası: anterior solda, posterior sağda. Renk bantları yaklaşık bölgesel ilişkiyi vurgular; gerçek kortikal alan sınırlarının veya kıvrımların birebir atlas çizimi değildir. Sulcus centralis: frontal ve parietal lob arasındaki sınır. Gyrus precentralis: oluğun önündeki primer motor alan. Gyrus postcentralis: oluğun arkasındaki primer somatik duyu alanı. Sulcus lateralis: temporal lobun üst sınırındaki belirgin oluk. Occipital lob: arka bölge; primer görsel alan esas olarak medial yüzde, bu yandan çizimde doğrudan gösterilmez.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667a55"/></marker></defs><rect width="760" height="480" fill="#f8f4e9"/><text x="35" y="43" font-size="16" fill="#44563c" font-family="Arial,sans-serif">ANTERIOR / ÖN</text><text x="545" y="43" font-size="16" fill="#44563c" font-family="Arial,sans-serif">POSTERIOR / ARKA</text><path d="M95 270Q42 170 126 112Q205 49 335 76Q480 56 582 123Q692 179 663 281Q640 344 529 354L278 346Q148 361 95 270Z" fill="#e7dcc8" stroke="#78866b" stroke-width="3"/><path d="M300 90Q320 145 296 206L277 255L301 270L324 209Q349 147 328 84Z" fill="#c8917e"/><path d="M341 84Q365 150 337 212L318 270L345 268L363 216Q389 146 370 85Z" fill="#a5bd95"/><path d="M338 80Q365 144 333 210L310 273" fill="none" stroke="#556a49" stroke-width="5"/><path d="M151 275Q250 253 310 273Q391 283 488 267" fill="none" stroke="#6b795f" stroke-width="4"/><path d="M565 130Q535 233 567 335" fill="none" stroke="#b6ab91" stroke-width="2" stroke-dasharray="6 5"/><circle cx="430" cy="74" r="13" fill="#526d48"/><text x="426" y="79" font-size="14" fill="#fff" font-family="Arial,sans-serif">1</text><path d="M419 81L353 129" fill="none" stroke="#667a55" stroke-width="2" /><circle cx="240" cy="145" r="13" fill="#526d48"/><text x="236" y="150" font-size="14" fill="#fff" font-family="Arial,sans-serif">2</text><path d="M252 147L304 153" fill="none" stroke="#667a55" stroke-width="2" /><circle cx="438" cy="153" r="13" fill="#526d48"/><text x="434" y="158" font-size="14" fill="#fff" font-family="Arial,sans-serif">3</text><path d="M426 158L359 170" fill="none" stroke="#667a55" stroke-width="2" /><circle cx="200" cy="394" r="13" fill="#526d48"/><text x="196" y="399" font-size="14" fill="#fff" font-family="Arial,sans-serif">4</text><path d="M207 381L231 267" fill="none" stroke="#667a55" stroke-width="2" /><circle cx="630" cy="232" r="13" fill="#526d48"/><text x="626" y="237" font-size="14" fill="#fff" font-family="Arial,sans-serif">5</text><text x="80" y="420" font-size="15" fill="#44563c" font-family="Arial,sans-serif">Motor: oluğun önü</text><text x="350" y="420" font-size="15" fill="#44563c" font-family="Arial,sans-serif">Somatik duyu: oluğun arkası</text><text x="80" y="450" font-size="13" fill="#44563c" font-family="Arial,sans-serif">Bölgesel kavram haritası; birebir korteks konturu / alan sınırı değildir.</text></svg>