<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title description"><title id="title">Distal humerusta eklem yüzleri ve çukurlar</title><desc id="description">Ön ve arka yüzler birbirinden ayrı şematik görünümlerdir. Lateral–medial yönler her görünümün üzerinde yazılıdır. Boyut, perspektif ve kemik konturu basitleştirilmiştir; gerçek kemiği tanımak için atlasla karşılaştır. Capitulum: ön-lateral eklem yüzü, radius başıyla temas. Trochlea: medial makara, ulna ile temas. Fossa radialis: ön yüzde capitulumun üstünde. Fossa coronoidea: ön yüzde trochleanın üstünde. Fossa olecrani: arka yüzde büyük çukur. Processus coronoideus: humerusta değil ulnada; metin kutusunda ayrı gösterildi.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667a55"/></marker></defs><rect width="760" height="480" fill="#f8f4e9"/><text x="90" y="45" font-size="19" fill="#44563c" font-family="Arial,sans-serif">ÖN YÜZ</text><text x="470" y="45" font-size="19" fill="#44563c" font-family="Arial,sans-serif">ARKA YÜZ</text><text x="35" y="80" font-size="12" fill="#44563c" font-family="Arial,sans-serif">LATERAL</text><text x="250" y="80" font-size="12" fill="#44563c" font-family="Arial,sans-serif">MEDİAL</text><text x="410" y="80" font-size="12" fill="#44563c" font-family="Arial,sans-serif">MEDİAL</text><text x="640" y="80" font-size="12" fill="#44563c" font-family="Arial,sans-serif">LATERAL</text><path d="M125 95L125 220Q90 240 85 290Q100 345 165 320L207 330Q275 350 280 290Q277 250 235 218L235 95" fill="#e6dcc1" stroke="#8b8c72" stroke-width="3"/><ellipse cx="139" cy="290" rx="28" ry="26" fill="#b5c4a4" stroke="#617453"/><path d="M190 270Q210 260 226 275L234 314Q210 330 183 310Z" fill="#b5c4a4" stroke="#617453"/><ellipse cx="140" cy="245" rx="19" ry="14" fill="#f8f4e9" stroke="#9d967f"/><ellipse cx="208" cy="238" rx="22" ry="16" fill="#f8f4e9" stroke="#9d967f"/><circle cx="100" cy="315" r="13" fill="#526d48"/><text x="96" y="320" font-size="14" fill="#fff" font-family="Arial,sans-serif">1</text><path d="M110 306L128 294" fill="none" stroke="#667a55" stroke-width="2" /><circle cx="255" cy="326" r="13" fill="#526d48"/><text x="251" y="331" font-size="14" fill="#fff" font-family="Arial,sans-serif">2</text><path d="M245 316L221 300" fill="none" stroke="#667a55" stroke-width="2" /><circle cx="82" cy="220" r="13" fill="#526d48"/><text x="78" y="225" font-size="14" fill="#fff" font-family="Arial,sans-serif">3</text><path d="M93 226L130 240" fill="none" stroke="#667a55" stroke-width="2" /><circle cx="270" cy="206" r="13" fill="#526d48"/><text x="266" y="211" font-size="14" fill="#fff" font-family="Arial,sans-serif">4</text><path d="M260 213L225 230" fill="none" stroke="#667a55" stroke-width="2" /><path d="M490 95L490 220Q455 240 450 290Q465 345 530 320L572 330Q640 350 645 290Q642 250 600 218L600 95" fill="#e6dcc1" stroke="#8b8c72" stroke-width="3"/><ellipse cx="550" cy="250" rx="37" ry="36" fill="#f8f4e9" stroke="#9d967f"/><circle cx="630" cy="210" r="13" fill="#526d48"/><text x="626" y="215" font-size="14" fill="#fff" font-family="Arial,sans-serif">5</text><path d="M619 216L577 237" fill="none" stroke="#667a55" stroke-width="2" /><rect x="60" y="375" width="640" height="55" rx="12" fill="#e5e9dc" stroke="#879477" stroke-width="1.5"/><text x="72" y="408.5" font-size="16" fill="#44563c" font-family="Arial,sans-serif">6. Processus coronoideus ULNADADIR; humerusta fossa vardır.</text></svg>