<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="760" height="480" role="img" aria-labelledby="title description"><title id="title">Rotator cuff kaslarının scapula ile ilişkisi</title><desc id="description">Sol panel scapulanın arka yüzü, sağ panel ön/kostal yüzü için kavramsal haritadır. Renkli alanlar kasın başlangıç bölgesini yaklaşık gösterir; gerçek kas konturu, lif yönü veya ölçek değildir. Teres minorun lateral kenar ilişkisi ile subscapularisin ön yüz ilişkisini ayır. Supraspinatus: posterior yüzde spinanın üstündeki fossa. Infraspinatus: posterior yüzde spinanın altındaki geniş fossa. Teres minor: lateral kenar boyunca, infraspinatusun altında. Subscapularis: anterior / kostal yüzdeki fossa. Spina scapulae: posterior çukurları ayıran kemik işareti; kas değildir.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#667a55"/></marker></defs><rect width="760" height="480" fill="#f8f4e9"/><text x="55" y="44" font-size="17" fill="#44563c" font-family="Arial,sans-serif">ARKA YÜZ • POSTERIOR</text><text x="440" y="44" font-size="17" fill="#44563c" font-family="Arial,sans-serif">ÖN YÜZ • KOSTAL</text><path d="M80 100L300 90L280 145L160 350Z" fill="#e7ddc5" stroke="#859174" stroke-width="3"/><path d="M94 112L277 103L262 143L109 166Z" fill="#c4cfad"/><path d="M110 184L260 160L162 318Z" fill="#ca9e8c"/><path d="M275 167L293 180L181 334L173 318Z" fill="#ad8878"/><path d="M82 175L295 145" stroke="#617454" stroke-width="10" stroke-linecap="round"/><path d="M460 100L680 90L660 145L540 350Z" fill="#e7ddc5" stroke="#859174" stroke-width="3"/><path d="M478 119L657 112L639 151L542 322Z" fill="#c79e8a"/><circle cx="170" cy="131" r="13" fill="#526d48"/><text x="166" y="136" font-size="14" fill="#fff" font-family="Arial,sans-serif">1</text><circle cx="171" cy="226" r="13" fill="#526d48"/><text x="167" y="231" font-size="14" fill="#fff" font-family="Arial,sans-serif">2</text><circle cx="260" cy="238" r="13" fill="#526d48"/><text x="256" y="243" font-size="14" fill="#fff" font-family="Arial,sans-serif">3</text><path d="M249 243L224 265" fill="none" stroke="#667a55" stroke-width="2" /><circle cx="550" cy="210" r="13" fill="#526d48"/><text x="546" y="215" font-size="14" fill="#fff" font-family="Arial,sans-serif">4</text><circle cx="48" cy="181" r="13" fill="#526d48"/><text x="44" y="186" font-size="14" fill="#fff" font-family="Arial,sans-serif">5</text><path d="M61 179L99 172" fill="none" stroke="#667a55" stroke-width="2" /><text x="50" y="399" font-size="16" fill="#44563c" font-family="Arial,sans-serif">1–3 → tuberculum majus</text><text x="435" y="399" font-size="16" fill="#44563c" font-family="Arial,sans-serif">4 → tuberculum minus</text><text x="50" y="442" font-size="13" fill="#44563c" font-family="Arial,sans-serif">Sadeleştirilmiş başlangıç alanları; gerçek kas konturu ve ölçeği değildir.</text></svg>