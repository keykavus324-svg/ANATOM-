<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Sinoviyal eklemin kesiti</title><desc id="description">İki kemik ucu arasındaki boşluk ve çevresindeki kapsül büyütülerek gösterildi. Her sinoviyal eklemde disk veya menisküs bulunmaz. 1. Eklem kıkırdağı: Kemik uçlarını örter ve kaygan temas yüzeyi oluşturur. 2. Eklem boşluğu: Az miktarda sinoviyal sıvı içeren aralık. 3. Sinoviyal zar: Kapsülün iç yüzünü döşer; kıkırdak yüzeyini örtmez. 4. Fibröz kapsül: Eklemi çevreleyen dış bağ dokusu kılıfı. 5. Bağ desteği: Hareketi yönlendiren ve aşırı yer değiştirmeyi sınırlayan destek.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M319 44L414 44L414 125Q445 166 425 201Q367 225 306 201Q286 165 319 125Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M307 256Q367 234 426 256Q444 293 413 324L413 410L320 410L320 324Q288 290 307 256Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M309 95C251 149 254 191 269 230C248 272 261 330 309 356L425 356C472 312 483 273 463 230C482 184 463 123 426 95" fill="none" stroke="#666b55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M309 114C273 153 275 197 289 229C273 271 279 318 313 337M424 114C454 152 453 196 442 229C458 269 450 311 424 337" fill="none" stroke="#cb9b91" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M303 201Q365 226 428 201" fill="none" stroke="#99adb2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M304 253Q365 232 429 253" fill="none" stroke="#99adb2" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M301 219Q365 239 435 219L435 237Q364 220 301 237Z" fill="#dce6dc" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M250 174Q241 232 253 291" fill="none" stroke="#a8b69a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" /><path d="M535 164L402 209" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="402" cy="209" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="535" cy="164" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="535" y="169" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">1</text><path d="M540 237L375 228" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="375" cy="228" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="540" cy="237" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="540" y="242" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">2</text><path d="M533 322L449 295" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="449" cy="295" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="533" cy="322" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="533" y="327" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">3</text><path d="M177 132L276 144" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="276" cy="144" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="177" cy="132" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="177" y="137" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">4</text><path d="M174 290L251 251" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="251" cy="251" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="174" cy="290" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="174" y="295" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">5</text></g></svg>
