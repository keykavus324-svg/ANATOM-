<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Yarıkürenin lobları</title><desc id="description">Serebral yarıkürenin yandan görünümü; ön soldadır. Loblar renkle ayrıldı; girus ve sulcus desenleri sadeleştirilmiştir. 1. Frontal lob: Planlama, kişilik ve istemli hareketin (girus precentralis) bölgesi. 2. Paryetal lob: Duyu bütünlemesi ve beden uzay algısı; arkasında girus postcentralis vardır. 3. Temporal lob: İşitme, dil anlama ve bellek ilişkilerinin bölgesi. 4. Oksipital lob: Görme korteksinin bulunduğu arka bölge. 5. Serebellum: Hareketin koordinasyonu, denge ve kas tonusunun ayarı. 6. Beyin sapı: Mezensefalon, pons ve medulla oblongata; yaşamsal merkezleri barındırır.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M158 278C142 206 178 112 268 84C316 68 366 62 408 74L392 168C332 176 302 212 292 252L284 318C224 310 17