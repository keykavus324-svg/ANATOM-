<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Tipik lomber omurun üstten görünümü</title><desc id="description">Omurun üstten görünümü. Gövde önde, spinöz çıkıntı arkadadır; yönler şekil üzerinde yazılıdır. Gerçek kemikteki süngerimsi doku ayrıntısı çizilmemiştir. 1. Corpus vertebrae: Omurun yük taşıyan öndeki gövdesi; lumbal bölgede en geniştir. 2. Foramen vertebrale: Omuriliği, kökleri ve örtülerini barındıran açıklık; omurlar üst üste gelince vertebral kanalı oluşturur. 3. Processus transversus: İki yana uzayan çıkıntı; kas ve bağ tutunma yeridir. 4. Processus articularis superior: Üstteki komşu omurla eklemleşen yüzey. 5. Processus spinosus: Arkaya doğru uzanan palpe edilebilen çıkıntı; C7 düzeyinde en belirgindir (vertebra prominens).</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><text x="380" y="58" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">POSTERIOR</text><text x="380" y="438" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">ANTERIOR</text><path d="M352 250L408 250L398 150Q380 136 362 150Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M300 238Q300 172 348 150L362 152L352 250Q318 252 300 238Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M460 238Q460 172 412 150L398 152L408 250Q442 252 460 238Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><ellipse cx="303" cy="236" rx="15" ry="26" fill="#a8b69a" stroke="#666b55" stroke-width="2"/><ellipse cx="457" cy="236" rx="15" ry="26" fill="#a8b69a" stroke="#666b55" stroke-width="2"/><path d="M300 196C252 176 200 172 158 186C172 208 226 222 278 218Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M460 196C508 176 560 172 602 186C588 208 534 222 482 218Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M314 246Q314 178 380 166Q446 178 446 246Q446 268 380 272Q314 268 314 246Z" fill="#f3ecd9" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M262 276C262 254 300 268 380 268C460 268 498 254 498 276L492 330C470 368 420 388 380 388C340 388 290 368 268 330Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M282 292Q380 314 478 292" fill="none" stroke="#666b55" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M148 330L300 318" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="300" cy="318" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="148" cy="330" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="148" y="335" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">1</text><path d="M622 132L408 204" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="408" cy="204" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="622" cy="132" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="622" y="137" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">2</text><path d="M104 182L206 196" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="206" cy="196" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="104" cy="182" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="104" y="187" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">3</text><path d="M636 268L452 240" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="452" cy="240" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="636" cy="268" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="636" y="273" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">4</text><path d="M135 88L370 172" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="370" cy="172" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="135" cy="88" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="135" y="93" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">5</text><text x="380" y="308" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">CORPUS</text></g></svg>
