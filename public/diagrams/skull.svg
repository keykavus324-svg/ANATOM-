<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Kafatasının yandan kemik haritası</title><desc id="description">Büyük kemik bölgeleri renkle ayrıldı. Suturalar ve foraminalar ayrıntılı cerrahi sınırları göstermek için değil, bölgesel yön bulmak için çizilmiştir. 1. Os frontale: Alın ve orbita tavanı yönündeki kemik. 2. Os parietale: Kafatası kubbesinin geniş üst-yan bölgesi. 3. Os occipitale: Arka-alt kafatası bölgesi. 4. Os temporale: Kulak bölgesi çevresindeki alt-yan kemik. 5. Maxilla ve os zygomaticum: Üst çene ve elmacık bölgesinin ayrı kemikleri. 6. Mandibula: Hareketli alt çene kemiği. 7. Os sphenoidale: Şakak bölgesinde küçük bir yüzü görülen taban kemiği.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M224 199C209 152 235 88 294 66C374 33 469 60 505 124C536 178 522 236 493 268L474 298L455 287L410 304L335 304L320