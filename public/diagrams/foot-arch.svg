<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Ayağın medial uzunlamasına kemeri</title><desc id="description">Topuk ve ön ayak desteği arasındaki kemer gösterilir. Diğer kemerler ve bütün tarsal kemikler bu görünümde ayrı ayrı çizilmemiştir. 1. Calcaneus: Arka destek bölgesi; topuğun iskeletini oluşturur. 2. Talus: Bacak yükünü ayağa aktarır; kemerin üst bölümündedir. 3. Naviculare ve cuneiforme mediale: Talustan birinci metatarsale uzanan medial hattın ara kemikleri. 4. Birinci metatarsal: Medial kemerin ön desteğine katılır. 5. Plantar destek: Aponevroz ve bağların gerilimi kemerin korunmasına katkı verir.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M176 294Q177 243 223 252L272 284L276 328L202 342Q164 332 176 294Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M229 220Q253 193 292 216L312 249L269 280L228 254Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M308 243L351 249L359 276L313 288L280 278Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M357 252L403 268L410 299L365 301L352 278Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M410 277Q481 297 533 307L548 326L531 342Q477 319 409 310Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M553 316L595 323L599 341L548 338Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M602 325L629 329Q644 342 625 347L599 342Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M208 350Q351 349 538 352" fill="none" stroke="#a8b69a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M196 349Q344 250 539 348" fill="none" stroke="#cb9b91" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M125 369L665 369" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" /><path d="M104 278L207 289" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="207" cy="289" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="104" cy="278" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="104" y="283" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">1</text><path d="M212 142L268 234" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="268" cy="234" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="212" cy="142" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="212" y="147" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">2</text><path d="M423 174L357 265" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="357" cy="265" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="423" cy="174" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="423" y="179" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">3</text><path d="M598 220L484 310" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="484" cy="310" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="598" cy="220" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="598" y="225" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">4</text><path d="M411 420L374 350" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="374" cy="350" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="411" cy="420" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="411" y="425" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">5</text></g></svg>
