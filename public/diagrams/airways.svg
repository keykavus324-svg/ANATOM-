<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Tracheadan akciğer loblarına</title><desc id="description">Sağ akciğer izleyicinin solundadır. Fissürler ve ana bronşlar gösterilmiş; segmental dalların tamamı çizilmemiştir. 1. Trachea: Kıkırdak destekli ortak hava yolu. 2. Sağ ana bronş: Görece kısa, geniş ve daha diktir. 3. Sol ana bronş: Görece uzun ve daha yatay seyreder. 4. Sağ akciğer • üç lob: Horizontal ve oblik fissürlerle ayrılır. 5. Sol akciğer • iki lob: Oblik fissürle ayrılır; medial kenarda kalp çentiği bulunur.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M324 101C288 80 233 105 205 157C170 221 162 315 176 371Q248 402 329 359Z" fill="url(#muscle)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M415 102C455 83 504 113 535 174C560 225 576 324 567 370Q500 397 423 3