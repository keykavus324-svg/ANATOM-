<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Villusun iki taşıma yolu</title><desc id="description">Tek bir villusta yüzey epiteli, kapiller ağ ve merkezi lenf kapilleri gösterilmiştir. Mikrovilluslar ayrı bir daha küçük ölçektedir. 1. Epitel yüzeyi: Besin ürünlerinin emildiği hücre tabakası. 2. Kan kapillerleri: Suda çözünen birçok emilim ürününü portal dolaşıma yönlendirir. 3. Merkezi lenf kapilleri: Uzun zincirli yağların taşınmasına katılır. 4. Mukoza tabanı: Villuslar burada duvarın damar ve lenf ağına bağlanır.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M225 387L268 350L279 171C281 99 311 53 369 49C425 47 459 106 462 169L472 350L513 387Z" fill="url(#bone)" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M242 385L284 352L296 172C298 109 321 68 369 65C411 64 443 111 