<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">İnspirasyonda diaphragmanın inişi</title><desc id="description">Kesikli çizgi gevşemiş yüksek kubbeyi, düz çizgi inspirasyonda alçalmış kubbeyi gösterir. Akciğer ve göğüs duvarı ayrıntıları sadeleştirilmiştir. 1. Gevşemiş konum: Diaphragma kubbesi daha yüksektir. 2. Kasılma ve alçalma: Dikey göğüs boyutu artar; hava girişini destekleyen basınç değişimi oluşur. 3. Thorax: Hacmi artan göğüs bölgesi. 4. Abdomen: İnen diaphragma karın içeriğini aşağı-öne doğru yer değiştirir.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><path d="M257 80Q180 181 216 374L531 374Q568 181 491 80" fill="none" stroke="#666b55" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><path d="M276 103Q237 163 247 258Q289 278 337 254L337 112Z" fill="#dac6b9" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M407 112L407 253Q455 279 500 259Q509 165 471 103Z" fill="#dac6b9" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M217 324Q279 202 372 306Q462 202 531 324" fill="none" stroke="#666b55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6"/><path d="M216 365Q284 288 373 359Q462 288 532 365" fill="none" stroke="#cb9b91" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" /><path d="M290 267L290 317" fill="none" stroke="#666b55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M457 267L457 317" fill="none" stroke="#666b55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M372 127L372 222" fill="none" stroke="#666b55" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M136 250L280 264" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="280" cy="264" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="136" cy="250" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="136" y="255" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">1</text><path d="M608 348L470 323" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="470" cy="323" rx="2.5" ry="2.5" fill="#666b55" stroke="#666b55" stroke-width="2"/><circle cx="608" cy="348" r="15" fill="#f9f5e9" stroke="#666b55" stroke-width="1.1"/><text x="608" y="353" text-anchor="middle" font-family="Georgia,serif" font-size="15" fill="#666b55">2</text><path d="M609 163L469 163" fill="none" stroke="#666b55" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 3"/><ellipse cx="469" cy="163" rx="2.