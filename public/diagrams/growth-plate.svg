<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title description"><title id="title">Uzunlamasına büyüme bölgesi</title><desc id="description">Epifiz plağındaki kıkırdak düzeni büyüme yönünü açıklamak için büyütülmüş ve sadeleştirilmiştir; mikroskobik ölçek değildir. 1. Epifiz tarafı: Uç bölgesine yakın kıkırdak hücreleri. 2. Çoğalma bölgesi: Kıkırdak hücreleri sütun benzeri diziler oluşturur. 3. Hipertrofi bölgesi: Hücreler büyür; matriks ve doku düzeni değişir. 4. Metafiz tarafı: Kıkırdağın yerini kemik dokusunun aldığı bölge.</desc><defs><linearGradient id="bone" x2="1" y2=".5"><stop stop-color="#f5ecd5"/><stop offset=".5" stop-color="#ddc9a6"/><stop offset="1" stop-color="#eee1c5"/></linearGradient><linearGradient id="muscle" x2="1" y2=".6"><stop stop-color="#e5c9b6"/><stop offset=".6" stop-color="#c89989"/><stop offset="1" stop-color="#ddbdab"/></linearGradient><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(17)"><rect width="10" height="10" fill="#e8dcc2"/><path d="M0 0V10M0 4L10 9" stroke="#a99e80" stroke-width=".6"/></pattern><pattern id="paper" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".45" fill="#8d8868" opacity=".11"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#666b55" stroke-width="1.4"/></marker></defs><rect width="760" height="460" fill="#f7f1e3"/><rect width="760" height="460" fill="url(#paper)"/><path d="M20 47V20H47M713 20H740V47M20 413V440H47M713 440H740V413" fill="none" stroke="#c8c5ae" stroke-width="1"/><g><rect x="246" y="62" width="264" height="338" rx="30" fill="#eee3cd" stroke="#666b55" stroke-width="1.7"/><rect x="259" y="73" width="238" height="74" rx="20" fill="#dae1ce" stroke="#666b55" stroke-width="1.7"/><rect x="259" y="149" width="238" height="91" rx="3" fill="#e1d5bd" stroke="#666b55" 